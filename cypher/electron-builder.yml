appId: com.baron.cypher
productName: Cypher
copyright: Copyright © 2026 Baron

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.prettierignore,.prettierrc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  executableName: Cypher
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# Where the app looks for updates. electron-builder writes latest.yml and a
# .blockmap next to the installer; electron-updater uses the blockmap to fetch
# only the changed blocks, so an update is a few MB rather than the whole exe.
publish:
  provider: github
  owner: Ekow-Davis
  repo: cypher

nsis:
  # No spaces: GitHub silently rewrites spaces in release asset filenames to
  # dots, which leaves the name in latest.yml pointing at a file that doesn't
  # exist and breaks every auto-update with a 404.
  artifactName: ${productName}-Setup-${version}.${ext}
  # Required for differential updates to work at all.
  differentialPackage: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cypher

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Code signing is intentionally left unconfigured for now.
# Unsigned builds trigger a Windows SmartScreen warning on first run;
# we add signing before any wider distribution.
